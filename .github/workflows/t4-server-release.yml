name: T4 release

on:
  push:
    tags:
      - "t4-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release after all builds pass
        type: boolean
        default: true

concurrency:
  group: t4-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    if: github.repository == 'mweinbach/t4code'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Check release version and tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/server/package.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-t4\.[0-9]+$ ]]; then
            echo "Expected a T4 fork version such as 0.0.38-t4.1; received $version." >&2
            exit 1
          fi
          for package in apps/desktop apps/web packages/contracts; do
            test "$(node -p "require('./$package/package.json').version")" = "$version"
          done
          tag="t4-v$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version." >&2
            exit 1
          fi
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            if [[ "$(git rev-parse "$tag^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              echo "Tag $tag already belongs to another commit." >&2
              exit 1
            fi
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists. Bump the T4 version instead of replacing it." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  server:
    name: Build and verify server
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...
              - --filter=@t3tools/web...
              - --filter=@t3tools/scripts...

      - name: Build server and web client
        run: vp run --filter t3 build

      - name: Pack server artifact
        run: node scripts/pack-t4-server.ts --out-dir "$RUNNER_TEMP/t4-release"

      - name: Verify installation and native dependencies
        shell: bash
        env:
          T4_EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/t4-install"
          mkdir -p "$install_dir"
          node --input-type=module - "$install_dir" <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { T4_NATIVE_INSTALL_SCRIPTS } from './packages/shared/src/t4Release.ts';
          fs.writeFileSync(path.join(process.argv[2], 'package.json'), JSON.stringify({
            private: true,
            allowScripts: Object.fromEntries(T4_NATIVE_INSTALL_SCRIPTS.map(name => [name, true])),
          }));
          JS
          npm install --prefix "$install_dir" --no-audit --no-fund "$RUNNER_TEMP/t4-release/t4-server.tgz"
          installed_version=$(NO_COLOR=1 "$install_dir/node_modules/.bin/t4" --version)
          printf '%s\n' "$installed_version"
          test "$installed_version" = "t3 v$T4_EXPECTED_VERSION"
          cd "$install_dir"
          node --input-type=module - "$install_dir" <<'JS'
          import { createRequire } from 'node:module';
          import path from 'node:path';
          const require = createRequire(path.join(process.argv[2], 'package.json'));
          require('node-pty');
          await import('@ff-labs/fff-node');
          require('msgpackr-extract');
          JS

      - name: Upload server artifact
        uses: actions/upload-artifact@v7
        with:
          name: t4-release-server
          path: ${{ runner.temp }}/t4-release/t4-server.tgz
          if-no-files-found: error

  desktop:
    name: Build macOS Apple Silicon
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build desktop installers
        shell: bash
        env:
          T4_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          T3CODE_DESKTOP_SIGNED: "false"
        run: |
          set -euo pipefail
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --build-version "$T4_RELEASE_VERSION" \
            --verbose

      - name: Verify macOS archives and packaged server
        shell: bash
        env:
          T4_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          hdiutil verify "release/T4-Code-$T4_RELEASE_VERSION-arm64.dmg"
          ditto -x -k "release/T4-Code-$T4_RELEASE_VERSION-arm64.zip" "$RUNNER_TEMP/t4-mac"
          app="$RUNNER_TEMP/t4-mac/T4 Code.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = com.mweinbach.t4code
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$T4_RELEASE_VERSION"
          test -s "$app/Contents/Resources/app.asar"
          installed_version=$(ELECTRON_RUN_AS_NODE=1 NO_COLOR=1 "$app/Contents/MacOS/T4 Code" "$app/Contents/Resources/app.asar/apps/server/dist/bin.mjs" --version)
          printf '%s\n' "$installed_version"
          test "$installed_version" = "t3 v$T4_RELEASE_VERSION"

      - name: Collect installers
        shell: bash
        env:
          T4_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-publish
          for extension in dmg zip; do
            artifact="release/T4-Code-$T4_RELEASE_VERSION-arm64.$extension"
            test -s "$artifact"
            cp "$artifact" release-publish/
          done

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: t4-release-desktop-mac-arm64
          path: release-publish/*
          if-no-files-found: error

  publish:
    name: Publish complete T4 release
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    needs: [preflight, server, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      T4_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      T4_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: t4-release-*
          merge-multiple: true
          path: release-publish

      - name: Verify complete release and write checksums
        shell: bash
        working-directory: release-publish
        run: |
          set -euo pipefail
          assets=(
            t4-server.tgz
            "T4-Code-$T4_RELEASE_VERSION-arm64.dmg"
            "T4-Code-$T4_RELEASE_VERSION-arm64.zip"
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          sha256sum "${assets[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Publish immutable release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$T4_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $T4_RELEASE_TAG already exists; refusing to replace its assets." >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/t4-release-notes.md" <<EOF
          T4 Code $T4_RELEASE_VERSION, built from $GITHUB_SHA.

          - macOS Apple Silicon: arm64 DMG and ZIP.
          - Remote server and web client: t4-server.tgz.

          These are personal-fork builds. macOS builds are not Developer ID signed or notarized. macOS may require an explicit security override when opening them. T4 uses its own application identity and ~/.t4 data directory. Desktop automatic updates remain disabled.

          Install the matching remote server with:

              npx --yes --allow-scripts=node-pty,msgpackr-extract --package https://github.com/$GITHUB_REPOSITORY/releases/download/$T4_RELEASE_TAG/t4-server.tgz -- t4

          SHA256SUMS contains checksums for all three release artifacts.
          EOF
          gh release create "$T4_RELEASE_TAG" release-publish/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "T4 Code $T4_RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/t4-release-notes.md" \
            --draft
          gh release edit "$T4_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
